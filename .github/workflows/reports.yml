name: Motorsport reports
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      series:
        type: choice
        options: [all, f1, wec]
        default: all
      year:
        description: 'WEC year (blank = current year)'
        type: string
permissions:
  contents: write
jobs:
  reports:
    outputs:
      source_sha: ${{ steps.report_commit.outputs.sha }}
    concurrency:
      group: motorsport-reports
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: F1 reports
        id: f1
        if: inputs.series != 'wec'
        continue-on-error: true
        env:
          OPENF1_CLIENT_ID: ${{ secrets.OPENF1_CLIENT_ID }}
          OPENF1_CLIENT_SECRET: ${{ secrets.OPENF1_CLIENT_SECRET }}
        run: |
          python tools/weekend_report.py --output-root .report-staging
          python -c 'import shutil; shutil.copytree(".report-staging", "reports", dirs_exist_ok=True)'
          python tools/build_archive.py
          python tools/build_portal.py
      - name: WEC reports
        id: wec
        if: inputs.series != 'f1'
        continue-on-error: true
        env:
          WEC_YEAR: ${{ inputs.year }}
        run: |
          args=()
          if [ -n "$WEC_YEAR" ]; then
            [[ "$WEC_YEAR" =~ ^20[0-9]{2}$ ]] || exit 1
            args+=(--year "$WEC_YEAR")
          fi
          python tools/wec_report.py --output .wec-staging "${args[@]}"
          mkdir -p reports/wec
          cp -a .wec-staging/. reports/wec/
          python -c 'import sys; from pathlib import Path; sys.path.insert(0,"tools"); from wec_report import build_index; build_index(Path("reports/wec"))'
      - name: Build landing page
        run: python tools/build_portal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motorsport-reports
          path: reports/
          retention-days: 30
      - name: Commit generated reports
        id: report_commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update motorsport reports'
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report collection failures
        if: steps.f1.outcome == 'failure' || steps.wec.outcome == 'failure'
        run: exit 1
  claude-review:
    needs: reports
    if: ${{ !cancelled() && needs.reports.outputs.source_sha != '' }}
    uses: ./.github/workflows/claude-report-review.yml
    with:
      artifact_name: motorsport-reports
      source_sha: ${{ needs.reports.outputs.source_sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
