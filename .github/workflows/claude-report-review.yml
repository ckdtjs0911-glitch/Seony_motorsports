name: Claude motorsport review and rescue

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  review:
    outputs:
      repair_ready: ${{ steps.repair_status.outputs.ready }}
    runs-on: ubuntu-latest
    env:
      CLAUDE_REVIEW_ENABLED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.4
      - name: Replace checkout reports with the generated snapshot (including deletions)
        run: python -c 'import shutil; shutil.rmtree("reports", ignore_errors=True)'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: reports
      - uses: actions/setup-node@v4
        if: env.CLAUDE_REVIEW_ENABLED == 'true'
        with:
          node-version: '22'
      - name: Install Claude Code CLI
        if: env.CLAUDE_REVIEW_ENABLED == 'true'
        continue-on-error: true
        run: npm install --global @anthropic-ai/claude-code@2.1.319
      - name: Review, rescue and validate automatic corrections
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_BASE_REF: ${{ github.sha }}
        run: python tools/claude_report_review.py --apply --compare-ref "$REVIEW_BASE_REF" --output-dir "$RUNNER_TEMP/claude-report-review"
      - name: Check validated repair status
        id: repair_status
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'claude-report-review' / 'status.json'
          status = json.loads(path.read_text()) if path.exists() else {}
          ready = status.get('repair', {}).get('status') == 'validated'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'ready={str(ready).lower()}\n')
          PY
      - name: Save review, rescue proposals and authentication status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/claude-report-review/
          if-no-files-found: warn
          retention-days: 30
  publish-rescue:
    needs: review
    if: needs.review.outputs.repair_ready == 'true' && github.repository == 'ckdtjs0911-glitch/Seony_motorsports'
    permissions:
      contents: write
    concurrency:
      group: motorsport-reports
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: claude-review-${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/claude-report-review
      - name: Publish validated corrections unless newer reports exist
        env:
          RESCUE_BASE_SHA: ${{ inputs.source_sha }}
        run: python tools/report_rescue.py --base-sha "$RESCUE_BASE_SHA" --output-dir "$RUNNER_TEMP/claude-report-review"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-rescue-publish-${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/claude-report-review/publish-status.json
          if-no-files-found: warn
          retention-days: 30
